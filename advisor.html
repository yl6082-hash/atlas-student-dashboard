x;border-radius:9px;background:#272c3c;color:#fff;font-size:10px}@media(max-width:820px){.side{display:none}.work{margin:0}.top{padding:18px}.content{padding:22px 15px}.summary,.layout{grid-template-columns:1fr}.detail{min-height:0}}</style><aside class="side"><div class="brand"><b>A</b>Atlas <small>顾问端</small></div><div class="nav"><button>⌂ 概览</button><button class="on">◌ 情报审核 <em id="navcount">2</em></button><button>◫ 学生进度</button><button>▤ 申请计划</button></div><div class="rule">审核原则<b>先证据，后建议</b>政策与截止日期必须回到学校官方页面确认。</div></aside><main class="work"><header class="top"><div><span>顾问工作台</span><h1>学校情报审核</h1></div><a class="back" href="./">查看学生端 ↗</a></header><div class="content"><section class="summary"><div><span>待审核</span><b id="pending">2</b><small>需要确认后才会影响学生任务</small></div><div><span>已批准</span><b id="approved">3</b><small>已进入本周情报池</small></div><div><span>监测学校</span><b>5</b><small>Cornell、UC Davis、NYU、CMU、Stanford</small></div></section><div class="layout"><section class="queue"><div class="title"><span>审核队列</span><h2>待确认的学校变化</h2></div><div id="list"></div></section><section class="detail" id="detail"></section></div></div></main><script>const x=[{s:'Carnegie Mellon University',c:'CMU',a:'#c41230',k:'申请要求',t:'本科申请要求监测已建立',f:'将持续监测招生页面、学院说明与补充材料要求的变化。',i:'作为你的冲刺校，任何材料或截止日期变化都应优先提醒。',n:'确认目标学院，并将本科招生页面纳入每周核查。',u:'https://www.cmu.edu/admission/'},{s:'Stanford University',c:'SU',a:'#8c1515',k:'招生情报',t:'本科招生与学术新闻监测已建立',f:'将持续追踪招生页面、研究新闻与目标专业的课程更新。',i:'用于判断你与学校研究方向的连接点，不作为录取预测依据。',n:'在活动列表中标记可与目标专业形成联系的项目。',u:'https://admission.stanford.edu/'}];let current=0,approved=3;function render(){let q=x.filter(v=>!v.done);pending.textContent=q.length;navcount.textContent=q.length;list.innerHTML=q.length?q.map((v,i)=>{let real=x.indexOf(v);return '<button class="item '+(real===current?'on':'')+'" data-id="'+real+'"><i class="mark" style="background:'+v.a+'">'+v.c+'</i><span><b>'+v.s+'</b><small>'+v.k+' · 待采集</small><strong>'+v.t+'</strong></span><em>待审核</em></button>'}).join(''
